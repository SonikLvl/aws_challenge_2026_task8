name: Deploy Lambda Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package and Deploy createOrder
        run: |
          cd lambdas/cmtr_9ped0fct_lambda_createOrder
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name cmtr_9ped0fct_lambda_createOrder \
            --zip-file fileb://function.zip

      - name: Package and Deploy reserveStock
        run: |
          cd lambdas/cmtr_9ped0fct_lambda_reserveStock
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name cmtr_9ped0fct_lambda_reserveStock \
            --zip-file fileb://function.zip

      - name: Package and Deploy sendNotification
        run: |
          cd lambdas/cmtr_9ped0fct_lambda_sendNotification
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name cmtr_9ped0fct_lambda_sendNotification \
            --zip-file fileb://function.zip